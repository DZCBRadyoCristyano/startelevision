<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>PLAYER</title>

<script src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>

<script>
jwplayer.key=
'Khpp2dHxlBJHC8MCmLnBuV2jK/DwDnJMniwF6EO9HC/riJ712ZmbHg==';
</script>

<style>

html,
body{

margin:0;

width:100%;

height:100%;

background:#000;

overflow:hidden;

}

/* PLAYER */

#player{

position:fixed;

inset:0;

}

/* LOGOS */

.logo-layer{

position:fixed;

top:0;

left:0;

right:0;

padding:

max(10px,2vw)

max(10px,2vw);

display:flex;

justify-content:space-between;

align-items:flex-start;

pointer-events:none;

z-index:999999;

}

.logo{

display:block;

width:auto;

height:auto;

/* RESPONSIVE */

max-width:min(18vw,220px);

max-height:min(10vh,100px);

object-fit:contain;

filter:
drop-shadow(
0 0 10px rgba(0,0,0,.9)
);

}

/* MOBILE */

@media(max-width:768px){

.logo{

max-width:32vw;

max-height:56px;

}

}

</style>

</head>

<body>

<div id="player"></div>

<!-- HINDI NASA LOOB NG PLAYER -->
<div class="logo-layer">

<img
class="logo"
src="https://i.imgur.com/97dUGWv.png">

<img
class="logo"
src="https://i.imgur.com/9llVCUS.png">

</div>

<script>

jwplayer(
"player"
)

.setup({

file:
"https://startelevisionph.itunerworldwide.workers.dev/master.live.m3u8",

type:
"hls",

width:
"100%",

height:
"100%",

aspectratio:
null,

stretching:
"fill",

autostart:
true,

mute:
true,

primary:
"html5",

logo:{
file:"",
hide:true
}

});

/* BASIC DETERRENTS */

document.addEventListener(
"contextmenu",
e=>e.preventDefault()
);

document.addEventListener(
"keydown",
function(e){

if(
e.key==="F12"
){

e.preventDefault();

}

if(
e.ctrlKey
&&
e.shiftKey
&&
(
e.key==="I"
||
e.key==="J"
)
){

e.preventDefault();

}

if(
e.ctrlKey
&&
(
e.key==="u"
||
e.key==="U"
)
){

e.preventDefault();

}

});

document.addEventListener(
"dragstart",
e=>e.preventDefault()
);

</script>

</body>

</html>
