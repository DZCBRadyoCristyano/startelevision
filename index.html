<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PLAYER</title>

<script src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>

<script>
jwplayer.key =
'Khpp2dHxlBJHC8MCmLnBuV2jK/DwDnJMniwF6EO9HC/riJ712ZmbHg==';
</script>

<style>

html,
body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
}

#player{
position:fixed;
inset:0;
}

/* LOGO CONTAINER */

.dual-logo{

position:absolute;

top:max(10px,2vw);

left:max(10px,2vw);

right:max(10px,2vw);

display:flex;

justify-content:space-between;

align-items:flex-start;

pointer-events:none;

z-index:999999;

}

/* LOGO */

.dual-logo img{

width:auto;

height:auto;

max-width:min(16vw,220px);

max-height:min(9vh,100px);

object-fit:contain;

filter:
drop-shadow(
0 0 8px rgba(0,0,0,.85)
);

}

/* MOBILE */

@media(max-width:768px){

.dual-logo img{

max-width:32vw;

max-height:58px;

}

}

</style>

</head>

<body>

<div id="player"></div>

<script>

var player =
jwplayer("player");

player.setup({

file:
"https://startelevisionph.itunerworldwide.workers.dev/master.live.m3u8",

type:
"hls",

width:
"100%",

height:
"100%",

stretching:
"uniform",

autostart:
true,

mute:
true,

primary:
"html5",

logo:{
file:"",
hide:true
}

});

/* INSERT LOGO INSIDE JW */

player.on(
"ready",
function(){

const target =
document.querySelector(
".jwplayer"
);

if(
target &&
!document.querySelector(
".dual-logo"
)
){

const layer =
document.createElement(
"div"
);

layer.className =
"dual-logo";

layer.innerHTML =

`
<img src="https://i.imgur.com/97dUGWv.png">

<img src="https://i.imgur.com/9llVCUS.png">
`;

target.appendChild(
layer
);

}

});

/* KEEP AFTER FULLSCREEN */

player.on(
"fullscreen",
function(){

setTimeout(function(){

const target =
document.querySelector(
".jwplayer"
);

const overlay =
document.querySelector(
".dual-logo"
);

if(
target &&
overlay
){

target.appendChild(
overlay
);

}

},200);

});

/* BASIC BLOCKS */

document.addEventListener(
"contextmenu",
e=>e.preventDefault()
);

document.addEventListener(
"keydown",
function(e){

if(
e.key==="F12"
){

e.preventDefault();

}

if(
e.ctrlKey
&&
e.shiftKey
&&
(
e.key==="I"
||
e.key==="J"
)
){

e.preventDefault();

}

if(
e.ctrlKey
&&
(
e.key==="u"
||
e.key==="U"
)
){

e.preventDefault();

}

});

</script>

</body>

</html>
