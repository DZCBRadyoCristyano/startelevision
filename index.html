<!DOCTYPE html>
<html>

<head>

<title>STAR TELEVISION - LIVE</title>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<script src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>

<script>
jwplayer.key =
'Khpp2dHxlBJHC8MCmLnBuV2jK/DwDnJMniwF6EO9HC/riJ712ZmbHg==';
</script>

<style>

html,
body{
margin:0;
padding:0;
width:100%;
height:100%;
background:#000;
overflow:hidden;
}

#video-wrapper{
position:relative;
width:100vw;
height:100vh;
}

#player-container{
width:100%;
height:100%;
}

.tv-logo{

position:fixed;

z-index:2147483647;

max-width:180px;
max-height:90px;

pointer-events:none;

object-fit:contain;

filter:
drop-shadow(
0 0 8px rgba(0,0,0,.9)
);

}

.left-logo{
top:20px;
left:20px;
}

.right-logo{
top:20px;
right:20px;
}

:fullscreen .tv-logo,
:-webkit-full-screen .tv-logo{
position:fixed;
}

@media(max-width:768px){

.tv-logo{

max-width:120px;

max-height:60px;

}

.left-logo{
top:10px;
left:10px;
}

.right-logo{
top:10px;
right:10px;
}

}

</style>

</head>

<body>

<div id="video-wrapper">

<img
class="tv-logo left-logo"
src="https://i.imgur.com/97dUGWv.png">

<img
class="tv-logo right-logo"
src="https://i.imgur.com/9llVCUS.png">

<div id="player-container"></div>

</div>

<script>

/* PLAYER */

jwplayer("player-container").setup({

file:
"https://startelevisionph.itunerworldwide.workers.dev/master.live.m3u8",

type:
"hls",

width:
"100%",

height:
"100%",

autostart:
true,

mute:
true,

stretching:
"uniform",

primary:
"html5",

logo:{
file:"",
hide:true
}

});

/* ANTI RIGHT CLICK */

document.addEventListener(
"contextmenu",
e=>e.preventDefault()
);

/* BLOCK KEYS */

document.addEventListener(
"keydown",
function(e){

if(
e.key==="F12"
){

e.preventDefault();

}

if(
e.ctrlKey &&
e.shiftKey &&
(
e.key==="I"||
e.key==="J"||
e.key==="C"
)
){

e.preventDefault();

}

if(
e.ctrlKey &&
(
e.key==="u"||
e.key==="U"
)
){

e.preventDefault();

}

}
);

/* BASIC DEVTOOLS DETECT */

setInterval(function(){

if(

window.outerWidth-
window.innerWidth>160

||

window.outerHeight-
window.innerHeight>160

){

document.body.innerHTML="";

}

},1000);

/* SELECT OFF */

document.addEventListener(
"selectstart",
e=>e.preventDefault()
);

/* DRAG OFF */

document.addEventListener(
"dragstart",
e=>e.preventDefault()
);

</script>

</body>

</html>
