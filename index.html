<!DOCTYPE html>
<html>

<head>

<title>PLAYER</title>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<script
src="https://content.jwplatform.com/libraries/IDzF9Zmk.js">
</script>

<script>
jwplayer.key=
'Khpp2dHxlBJHC8MCmLnBuV2jK/DwDnJMniwF6EO9HC/riJ712ZmbHg==';
</script>

<style>

html,
body{

margin:0;

padding:0;

width:100%;

height:100%;

overflow:hidden;

background:#000;

}

#player{

width:100vw;

height:100vh;

position:relative;

}

/* LOGO HOLDER */

.logo-wrap{

position:absolute;

top:2vw;

left:2vw;

right:2vw;

display:flex;

justify-content:space-between;

align-items:flex-start;

pointer-events:none;

z-index:999999;

}

/* LOGOS */

.logo{

height:auto;

width:auto;

max-width:14vw;

max-height:8vh;

object-fit:contain;

filter:

drop-shadow(
0 0 8px rgba(0,0,0,.8)
);

}

/* MOBILE */

@media(max-width:768px){

.logo-wrap{

top:12px;

left:12px;

right:12px;

}

.logo{

max-width:28vw;

max-height:60px;

}

}

/* BIG SCREEN */

@media(min-width:1800px){

.logo{

max-width:220px;

max-height:100px;

}

}

</style>

</head>

<body>

<div id="player">

<div class="logo-wrap">

<img
class="logo"
src="https://i.imgur.com/97dUGWv.png">

<img
class="logo"
src="https://i.imgur.com/9llVCUS.png">

</div>

</div>

<script>

const player=
jwplayer("player");

player.setup({

file:
"https://startelevisionph.itunerworldwide.workers.dev/master.live.m3u8",

type:
"hls",

width:
"100%",

height:
"100%",

autostart:
true,

mute:
true,

primary:
"html5",

stretching:
"uniform",

logo:{
file:"",
hide:true
}

});

/* KEEP LOGOS ON FULLSCREEN */

function moveOverlay(){

const wrapper=
document.querySelector(
".logo-wrap"
);

const target=
document.querySelector(
".jwplayer"
);

if(
wrapper &&
target &&
wrapper.parentNode!==target
){

target.appendChild(
wrapper
);

}

}

player.on(
"ready",
moveOverlay
);

document.addEventListener(
"fullscreenchange",
moveOverlay
);

document.addEventListener(
"webkitfullscreenchange",
moveOverlay
);

/* BASIC BLOCK */

document.addEventListener(
"contextmenu",
e=>e.preventDefault()
);

document.addEventListener(
"keydown",
function(e){

if(
e.key==="F12"
){

e.preventDefault();

}

if(

e.ctrlKey

&&

e.shiftKey

&&

(
e.key==="I"
||
e.key==="J"
||
e.key==="C"
)

){

e.preventDefault();

}

if(

e.ctrlKey

&&

(
e.key==="u"
||
e.key==="U"
)

){

e.preventDefault();

}

});

document.addEventListener(
"selectstart",
e=>e.preventDefault()
);

document.addEventListener(
"dragstart",
e=>e.preventDefault()
);

</script>

</body>

</html>
